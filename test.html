<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebSocket Test Client</title>
</head>
<body>
    <h1>WebSocket Test Client</h1>
    
    <div>
        <label>JWT Token:</label>
        <input type="text" id="token" placeholder="Paste your generated JWT token here" style="width: 300px;">
        <button onclick="connect()">Connect WS</button>
        <button onclick="disconnect()">Disconnect WS</button>
    </div>
    
    <div style="margin-top: 20px;">
        <label>Task Input (text):</label>
        <input type="text" id="taskText" placeholder="Extract keywords from this text">
        <button onclick="sendTask()">Create Task (REST)</button>
    </div>

    <div style="margin-top: 20px;">
        <h3>Event Log:</h3>
        <pre id="log" style="background: #f4f4f4; padding: 10px; height: 300px; overflow-y: scroll;"></pre>
    </div>

    <script>
        let ws = null;

        function log(message) {
            const logEl = document.getElementById('log');
            logEl.textContent += new Date().toLocaleTimeString() + ': ' + message + '\n';
            logEl.scrollTop = logEl.scrollHeight;
        }

        function connect() {
            const token = document.getElementById('token').value;
            if (!token) {
                alert('Please enter a JWT token first!');
                return;
            }

            if (ws) {
                ws.close();
            }

            ws = new WebSocket(`ws://localhost:3000/?token=${token}`);

            ws.onopen = () => {
                log('Connected to WebSocket server');
            };

            ws.onmessage = (event) => {
                const data = JSON.parse(event.data);
                log(`[Event Received] ${JSON.stringify(data, null, 2)}`);
            };

            ws.onclose = (event) => {
                log(`Disconnected from WebSocket server (Code: ${event.code}, Reason: ${event.reason})`);
            };

            ws.onerror = (error) => {
                log(`WebSocket Error: Check console for logs.`);
                console.error('WebSocket Error:', error);
            };
        }

        function disconnect() {
            if (ws) {
                ws.close();
            }
        }

        async function sendTask() {
            const token = document.getElementById('token').value;
            const text = document.getElementById('taskText').value || 'Test task';

            if (!token) {
                alert('Please enter a JWT token to authorize the REST request!');
                return;
            }

            log('Sending REST request to /tasks...');
            try {
                const response = await fetch('http://localhost:3000/tasks', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify({ text })
                });

                const data = await response.json();
                if (response.ok) {
                    log(`Task Created: ID = ${data.id}`);
                } else {
                    log(`REST Error: ${data.error || 'Unknown error'}`);
                }
            } catch (err) {
                log(`REST Fetch Error: ${err.message}`);
                console.error('REST Error:', err);
            }
        }
    </script>
</body>
</html>
